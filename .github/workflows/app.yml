name: "2. Application CI/CD Pipeline"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'terraform/**'
      - '**.md'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: "Build & Deploy Container"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acrsttfstatef08f6b6c

      - name: Build, Tag, and Push Docker Image
        run: |
          REGISTRY="acrsttfstatef08f6b6c.azurecr.io"
          IMAGE="fastapi-agent"
          TAG="${{ github.sha }}"

          docker build -t $REGISTRY/$IMAGE:$TAG -t $REGISTRY/$IMAGE:latest .
          docker push $REGISTRY/$IMAGE:$TAG
          docker push $REGISTRY/$IMAGE:latest

      - name: Deploy Revision to Azure Container Apps
        run: |
          az containerapp update \
            --name ca-aiagent-prod \
            --resource-group rg-aiagent-prod \
            --image acrsttfstatef08f6b6c.azurecr.io/fastapi-agent:${{ github.sha }}